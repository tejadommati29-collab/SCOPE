<style>
:root{--navy:#0f2a43;--navy2:#16385a;--ink:#1b2a38;--teal:#0f8b8d;--teal-d:#0b6e70;--blue:#1d5a85;--mut:#64748b;--line:rgba(15,42,67,.09);--ok:#16a34a;--bad:#dc2626;--warn:#d97706;
--glass:rgba(255,255,255,.66);--sh:0 10px 34px rgba(15,42,67,.09),inset 0 1px 0 rgba(255,255,255,.95)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font:14px/1.5 Inter,"Segoe UI",Roboto,system-ui,-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;min-height:calc(100*var(--vh,1vh));

.mu{color:var(--mut)}.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}.empty{padding:44px;text-align:center;color:var(--mut)}
.btn{background:linear-gradient(135deg,#12a0a2,#1d6ea8);color:#fff;border:0;border-radius:9px;padding:7px 14px;font-weight:600;font-size:12.5px;box-shadow:0 4px 12px rgba(15,139,141,.3);transition:.2s}.btn:hover{transform:translateY(-1px);box-shadow:0 7px 16px rgba(15,139,141,.38)}

.dl{flex:1;overflow-y:auto;padding:6px 24px}.dp{padding:12px 24px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:12.5px}
.dp button{background:#fff;border:1px solid rgba(15,42,67,.14);border-radius:8px;padding:5px 12px;font-weight:600;color:var(--navy)}.dp button:disabled{opacity:.4}


#toasts{position:fixed;top:78px;right:20px;z-index:70;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.ts{display:flex;gap:11px;align-items:center;max-width:340px;padding:11px 15px;border-radius:14px;background:rgba(15,42,67,.95);color:#fff;font-size:13px;box-shadow:0 12px 30px rgba(15,42,67,.35);animation:tin .4s ease;transition:.4s}.ts.o{opacity:0;transform:translateX(30px)}.ts .fic{background:rgba(255,255,255,.14);color:#7ee7e8}
@keyframes tin{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@media(max-width:1000px){.ov{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.feed{max-height:340px}header{flex-wrap:wrap;gap:10px;padding:10px 14px}nav{order:3;width:100%;margin:0;overflow-x:auto}.sp{display:none}.live{margin-left:auto}main{padding:18px 14px 40px}}

<script>

 login:"M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3",logout:"M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9",
 upload:"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12",download:"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3",
 prediction:"M9 3h6M10 3v6L4.5 19a1.5 1.5 0 0 0 1.3 2.2h12.4a1.5 1.5 0 0 0 1.3-2.2L14 9V3",export:"M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M12 18v-6M9 15l3 3 3-3",
 register:"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M19 8v6M22 11h-6",screening:"M22 3H2l8 9.5V19l4 2v-8.5z",db:"M3 5c0-1.1 4-2 9-2s9 .9 9 2-4 2-9 2-9-.9-9-2zM3 5v14c0 1.1 4 2 9 2s9-.9 9-2V5M3 12c0 1.1 4 2 9 2s9-.9 9-2",ov:"M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z"};
const svg=(k,s="")=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${s}><path d="${IC[k]||IC.pulse}"/></svg>`;

const P=s=>String(s).replace(" ","T"),NOW=()=>D&&D.server_time?new Date(P(D.server_time)).getTime():Date.now(),ago=t=>{if(!t)return"—";const s=Math.max(0,(NOW()-new Date(P(t)))/1e3);if(s<10)return"just now";if(s<60)return Math.floor(s)+"s ago";if(s<3600)return Math.floor(s/60)+"m ago";if(s<86400)return Math.floor(s/3600)+"h ago";return Math.floor(s/86400)+"d ago"};
const rel=t=>{if(!t)return'<span class="mu">—</span>';const s=Math.max(0,(NOW()-new Date(P(t)))/1e3),f=(n,u)=>`${n} ${u}${n===1?"":"s"} ago`;
 if(s<60)return"just now";const m=Math.floor(s/60);if(m<60)return f(m,"minute");const h=Math.floor(m/60);if(h<24)return f(h,"hour");const d=Math.floor(h/24);if(d<7)return f(d,"day");
 if(d<30)return f(Math.floor(d/7),"week");return f(Math.max(1,Math.floor(d/30)),"month")};
const pill=(t,c)=>`<span class="pill p-${c}">${esc(t)}</span>`,stc=s=>({success:"ok",failed:"bad",duplicate:"warn"}[s]||"mu");
const hit=(o,q)=>!q||JSON.stringify(o).toLowerCase().includes(q.toLowerCase());

const inR=(d,f)=>(!f.from||d.slice(0,10)>=f.from)&&(!f.to||d.slice(0,10)<=f.to);
function msg(a){const r=`<b>${esc(a.roll||"unknown")}</b>`,d=esc(a.detail||"");
 if(a.status==="failed")return{h:a.type==="login"?`Failed login attempt for ${r}`:`${r} — ${(TL[a.type]||a.type).toLowerCase()} failed`,d};
 return{h:({login:`${r} logged in`,logout:`${r} logged out`,register:`${r} created an account`,screening:`${r} screened a dataset`,upload:a.status==="duplicate"?`${r} re-uploaded an existing dataset`:`${r} uploaded a dataset`,prediction:`${r} ran a single prediction`,export:`${r} exported results`,download:`${r} downloaded a dataset`}[a.type]||`${r} — ${esc(a.type)}`),d:a.type==="login"||a.type==="logout"||a.type==="register"?"":d}}
const fic=a=>`fic t-${a.type} ${a.status==="failed"?"bad":""}`;

/* patch: update only when changed; keep focus + scroll */
function patch(el,html){if(el._h===html)return false;const a=document.activeElement,k=a&&el.contains(a)&&a.dataset&&a.dataset.f,pos=k&&a.selectionStart,sc=[...el.querySelectorAll(".tw,.dl")].map(e=>e.scrollTop);
 el.innerHTML=el._h=html;el.querySelectorAll(".tw,.dl").forEach((e,i)=>e.scrollTop=sc[i]||0);
 if(k){const n=el.querySelector(`[data-f="${k}"]`);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}}return true}
function tween(el,to){const from=+el.dataset.v||0;el.dataset.v=to;if(from===to||!window.requestAnimationFrame){el.textContent=to;return}const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/600);el.textContent=Math.round(from+(to-from)*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)}

/* tables: cols = [label, render, sortValue] */
function table(cols,rows,clk){
 if(SORT.i!=null){const f=cols[SORT.i][2];rows=[...rows].sort((a,b)=>{const x=f(a),y=f(b);return(x>y?1:x<y?-1:0)*SORT.d})}
 window._rows=rows;
 return rows.length?`<div class="tw"><table><thead><tr>${cols.map((c,i)=>`<th ${c[2]?`class="s" data-s="${i}"`:""}>${c[0]}${SORT.i===i?`<span class="ar"> ${SORT.d>0?"▲":"▼"}</span>`:""}</th>`).join("")}</tr></thead><tbody>${rows.map((r,i)=>`<tr ${clk?`class="clk" data-i="${i}"`:""}>${cols.map(c=>`<td>${c[1](r)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`:'<div class="empty">No matching records.</div>'}

/* smooth monotone curve */
function curve(P){const n=P.length,d=[],m=[];for(let i=0;i<n-1;i++)d[i]=(P[i+1][1]-P[i][1])/(P[i+1][0]-P[i][0]);m[0]=d[0];m[n-1]=d[n-2];
 for(let i=1;i<n-1;i++)m[i]=d[i-1]*d[i]<=0?0:(d[i-1]+d[i])/2;
 for(let i=0;i<n-1;i++){if(d[i]===0){m[i]=m[i+1]=0}else{const a=m[i]/d[i],b=m[i+1]/d[i],s=a*a+b*b;if(s>9){const t=3/Math.sqrt(s);m[i]=t*a*d[i];m[i+1]=t*b*d[i]}}}
 let p=`M${P[0][0]},${P[0][1]}`;for(let i=0;i<n-1;i++){const h=(P[i+1][0]-P[i][0])/3;p+=`C${P[i][0]+h},${P[i][1]+m[i]*h} ${P[i+1][0]-h},${P[i+1][1]-m[i+1]*h} ${P[i+1][0]},${P[i+1][1]}`}return p}
function chart(tr){const W=760,H=320,L=36,R=14,T=18,B=30,v=tr.values,n=v.length,mx=Math.max(...v,0),step=Math.max(1,Math.ceil(mx*1.2/4)),top=step*4;
 const X=i=>L+(W-L-R)*i/(n-1),Y=x=>T+(H-T-B)*(1-x/top),pts=v.map((x,i)=>[X(i),Y(x)]),ln=curve(pts),ev=Math.ceil(n/8);
 return `<svg viewBox="0 0 ${W} ${H}" id="csv"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#19b3b5" stop-opacity=".42"/><stop offset="1" stop-color="#19b3b5" stop-opacity="0"/></linearGradient><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#1d78b5"/><stop offset="1" stop-color="#19b3b5"/></linearGradient></defs>
 ${[0,1,2,3,4].map(i=>`<line class="gl" x1="${L}" x2="${W-R}" y1="${Y(step*i)}" y2="${Y(step*i)}" stroke-dasharray="${i?"4 5":""}"/><text x="${L-8}" y="${Y(step*i)+4}" text-anchor="end">${step*i}</text>`).join("")}
 ${tr.labels.map((l,i)=>i%ev===0||i===n-1&&n<9?`<text x="${X(i)}" y="${H-8}" text-anchor="middle">${esc(l)}</text>`:"").join("")}
 <path d="${ln}L${X(n-1)},${Y(0)}L${X(0)},${Y(0)}Z" fill="url(#ag)"/><path d="${ln}" fill="none" stroke="url(#lg)" stroke-width="3.2" stroke-linecap="round"/>
 ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===n-1?5.5:3}" fill="#fff" stroke="#14a3a6" stroke-width="2.2"/>`).join("")}
 <line id="cx" y1="${T}" y2="${H-B}" stroke="#14a3a6" stroke-dasharray="3 4" opacity="0"/></svg><div class="tip" id="tip"></div>`}
function hover(tr){const s=$("csv");if(!s)return;const W=760,L=36,R=14,n=tr.values.length;
 s.onmousemove=e=>{const r=s.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,i=Math.max(0,Math.min(n-1,Math.round((x-L)/(W-L-R)*(n-1)))),px=(L+(W-L-R)*i/(n-1))/W*r.width,c=$("cx");
  c.setAttribute("x1",L+(W-L-R)*i/(n-1));c.setAttribute("x2",L+(W-L-R)*i/(n-1));c.setAttribute("opacity",1);const t=$("tip");t.style.opacity=1;t.style.left=px+"px";t.style.top="30px";t.innerHTML=`<b>${tr.values[i]}</b> active user${tr.values[i]===1?"":"s"} · ${esc(tr.labels[i])}`};
 s.onmouseleave=()=>{$("cx").setAttribute("opacity",0);$("tip").style.opacity=0}}

model(){

 if(!MD)return head("Model details")+'<div class="glass box"><div class="empty">Loading…</div></div>';

 const f=(v,d=3)=>v==null?"—":(+v).toFixed(d),sec=(t,b)=>`<div class="glass box" style="margin-bottom:18px"><div class="bh"><h3>${t}</h3></div><div style="padding:18px 22px">${b}</div></div>`;
 const kv=a=>`<div class="ms" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin:0">${a.map(([k,v])=>`<div><span class="mu" style="font-size:12px">${k}</span><b style="overflow-wrap:anywhere;white-space:normal">${v}</b></div>`).join("")}</div>`;
 const o=MD.outputs,k=o[0];
 const info=sec("Model",kv([["Algorithm",esc(k.model)],["Training dataset",esc(MD.dataset||"—")],["Rows in training dataset",MD.n_rows]]));
 const met=(l,v,c)=>`<div style="background:#fff;border-radius:14px;padding:16px 18px;box-shadow:0 1px 6px rgba(15,42,67,.08);border-top:3px solid ${c}"><div class="mu" style="font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase">${l}</div><div style="font-size:30px;font-weight:800;color:var(--navy);margin-top:4px">${v}</div></div>`;
 const perf=sec("Evaluation metrics",`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px">${met("R² (test)",f(k.test_r2),"#19b3b5")}${met("R² (cross-validation)",f(k.cv_r2),"#1d78b5")}${met("MAE (log₁₀ of cm/s)",f(k.mae),"#d97706")}</div>`);
 const shp={};MD.importance.forEach(x=>shp[x.feature]=x.value);const mx=MD.importance[0]?MD.importance[0].value:1;
 const fl=[...MD.features].sort((a,b)=>(shp[b.name]||0)-(shp[a.name]||0));
 const feats=sec(`Input features (${MD.features.length})`,`<div class="tw"><table><thead><tr><th>#</th><th>Feature</th><th>Description</th><th>Unit</th><th>Range</th><th>SHAP importance</th></tr></thead><tbody>${fl.map((x,i)=>{const v=shp[x.name];return`<tr><td class="mu">${i+1}</td><td><b>${esc(x.name)}</b></td><td>${esc(x.label)}</td><td>${esc(x.unit||"")}</td><td class="mu">${f(x.min,2)} – ${f(x.max,2)}${x.unit?" "+esc(x.unit):""}</td><td style="min-width:220px"><div style="display:flex;align-items:center;gap:10px"><div style="flex:1;background:rgba(15,42,67,.07);border-radius:6px;height:10px"><div style="width:${v==null?0:(v/mx*100).toFixed(1)}%;height:100%;border-radius:6px;background:linear-gradient(90deg,#19b3b5,#1d78b5)"></div></div><b class="mono">${v==null?"—":v.toFixed(3)}</b></div></td></tr>`}).join("")}</tbody></table></div>`);
 /* actual vs predicted (training rows) */
 const A=MD.scatter.actual,Pd=MD.scatter.pred,lo=Math.floor(Math.min(...A,...Pd)),hi=Math.ceil(Math.max(...A,...Pd)),W=460,H=400,m=48,X=v=>m+(v-lo)/(hi-lo)*(W-m-16),Y=v=>H-m-(v-lo)/(hi-lo)*(H-m-16);
 let ticks="";for(let t=lo;t<=hi;t++)ticks+=`<line class="gl" x1="${X(t)}" y1="${Y(lo)}" x2="${X(t)}" y2="${Y(hi)}"/><line class="gl" x1="${X(lo)}" y1="${Y(t)}" x2="${X(hi)}" y2="${Y(t)}"/><text x="${X(t)}" y="${H-m+16}" text-anchor="middle">${t}</text><text x="${m-8}" y="${Y(t)+4}" text-anchor="end">${t}</text>`;
 const pts=A.map((a,i)=>`<circle cx="${X(a).toFixed(1)}" cy="${Y(Pd[i]).toFixed(1)}" r="3.6" fill="#1d78b5" fill-opacity=".6"><title>actual ${a.toFixed(2)} · predicted ${Pd[i].toFixed(2)}</title></circle>`).join("");
 const chart=sec("Actual vs predicted log10(k*)",`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:560px;display:block;margin:auto">${ticks}<line x1="${X(lo)}" y1="${Y(lo)}" x2="${X(hi)}" y2="${Y(hi)}" stroke="#d97706" stroke-dasharray="5 4" stroke-width="1.5"/>${pts}<text x="${(W+m)/2}" y="${H-6}" text-anchor="middle">Actual log10(k*) (log₁₀ of cm/s)</text><text transform="translate(12 ${H/2}) rotate(-90)" text-anchor="middle">Predicted log10(k*) (log₁₀ of cm/s)</text></svg>`);
 return head("Model details")+info+perf+feats+chart},

/* open a user's account in the normal user interface, read-only (new tab) */
async function openView(roll,ds,pred){const w=window.open("about:blank","_blank");
 try{const r=await fetch("/api/admin/users/"+encodeURIComponent(roll)+"/view-token",{...AH,method:"POST"});if(r.status===401||r.status===403){if(w)w.close();ss.removeItem("pcs_admin_token");TK=null;return showAdminLogin()}if(!r.ok)throw 0;
  const j=await r.json(),url="/#view="+encodeURIComponent(j.token)+"&roll="+encodeURIComponent(roll)+(ds?"&ds="+ds:"")+(pred?"&pred="+pred:"");if(w)w.location.href=url;else location.href=url}
 catch(e){if(w)w.close();alert("Could not open that account. Please try again.")}}
/* per-user history drawer */
function openUser(r){DR={roll:r,type:"",from:"",to:"",page:1};DD=null;$("veil").classList.add("on");$("drw").classList.add("on");$("drw")._h=null;loadUser();renderDrawer()}
function closeUser(){DR=null;$("veil").classList.remove("on");$("drw").classList.remove("on")}
async function loadUser(){if(!DR)return;try{const r=await fetch("/api/admin/users/"+encodeURIComponent(DR.roll)+"/activity",AH);if(r.status===401||r.status===403){ss.removeItem("pcs_admin_token");TK=null;return showAdminLogin()}if(r.ok){DD=await r.json();renderDrawer()}}catch(e){}}

 const all=DD.activity.filter(a=>(!DR.type||a.type===DR.type)&&inR(a.created_at,DR)),pages=Math.max(1,Math.ceil(all.length/12));DR.page=Math.min(DR.page,pages);const v=all.slice((DR.page-1)*12,DR.page*12);
 const h=`<div class="dh"><div class="row"><div class="who" style="font-size:18px"><div>${esc(DR.roll)}<div style="font-weight:400;font-size:12px;color:var(--mut)">Last login ${esc(u.last_login||"—")} · last used ${ago(u.last_used)}</div></div></div><div style="display:flex;gap:8px;align-items:center">${u.active?pill("● Active","ok"):pill("Inactive","mu")}<button class="x" data-close>×</button></div></div>
 <div class="ms"><div><b>${u.logins??0}</b><span>Logins</span></div><div><b>${u.datasets??0}</b><span>Datasets</span></div><div><b>${u.predictions??0}</b><span>Predictions</span></div><div><b>${u.exports??0}</b><span>Exports</span></div></div></div>
 <div class="df"><select data-d="type"><option value="">All activities</option>${Object.entries(TL).map(([k,x])=>`<option value="${k}" ${DR.type===k?"selected":""}>${x}</option>`).join("")}</select><input type="date" data-d="from" value="${DR.from}"><input type="date" data-d="to" value="${DR.to}"></div>
 <div class="dl">${v.map(a=>{return`<div class="fi"><div class="${fic(a)}">${svg(a.type)}</div><div class="fm"><div>${esc(TL[a.type]||a.type)} ${pill(a.status,stc(a.status))}</div>${a.detail?`<div class="d" title="${esc(a.detail)}">${esc(a.detail)}</div>`:""}<div class="t">${esc(a.created_at)} · ${ago(a.created_at)}</div></div></div>`}).join("")||'<div class="empty">No activity found.</div>'}</div>
 <div class="dp"><span>${all.length} event${all.length===1?"":"s"}</span><div style="display:flex;gap:8px;align-items:center"><button data-dp="-1" ${DR.page<=1?"disabled":""}>‹</button>${DR.page} / ${pages}<button data-dp="1" ${DR.page>=pages?"disabled":""}>›</button></div></div>`;
 const d=$("drw");if(patch(d,h)){d.querySelector("[data-close]").onclick=closeUser;d.querySelectorAll("[data-d]").forEach(e=>e.oninput=e.onchange=()=>{DR[e.dataset.d]=e.value;DR.page=1;renderDrawer()});d.querySelectorAll("[data-dp]").forEach(b=>b.onclick=()=>{DR.page+=+b.dataset.dp;renderDrawer()})}}
$("veil").onclick=closeUser;addEventListener("keydown",e=>{if(e.key==="Escape"){closeUser()}});


function nav(){$("nav").innerHTML=TABS.map(([k,l,i])=>`<button data-t="${k}" class="${k===TAB?"on":""}">${svg(i)}${l}</button>`).join("");
 $("nav").querySelectorAll("button").forEach(b=>b.onclick=()=>{TAB=b.dataset.t;reset();BUILT="";$("main")._h=null;nav();render();scrollTo(0,0)})}
function toast(a){const m=msg(a),t=document.createElement("div");t.className="ts";t.innerHTML=`<div class="${fic(a)}">${svg(a.type)}</div><div>${m.h}</div>`;$("toasts").appendChild(t);setTimeout(()=>t.classList.add("o"),4200);setTimeout(()=>t.remove(),4700)}
async function poll(){if(busy)return;busy=true;const dot=$("dot"),lt=$("lt");
 try{const r=await fetch("/api/admin/snapshot",AH);if(r.status===401||r.status===403){ss.removeItem("pcs_admin_token");TK=null;return showAdminLogin()}if(!r.ok)throw 0;
  D=await r.json();const top=D.activity.length?D.activity[0].id:0;
  if(SEEN!==null)D.activity.filter(a=>a.id>SEEN).reverse().slice(-3).forEach(toast);
  dot.classList.remove("off");lt.textContent="Live · "+D.server_time.slice(11);render();SEEN=top;if(DR)loadUser()}
 catch(e){dot.classList.add("off");lt.textContent="Reconnecting…"}finally{busy=false}}

function showAdminLogin(){
 $("nav").innerHTML="";
 $("dot").classList.add("off");
 $("lt").textContent="Login Required";
 $("out").textContent="Back to SCOPE";
 $("out").onclick=()=>location.replace("/");
 $("main").innerHTML=`<div class="glass" style="max-width:440px;margin:50px auto;padding:36px 32px;box-shadow:var(--sh);border-radius:22px;text-align:center">
  <div style="width:58px;height:58px;border-radius:16px;background:linear-gradient(135deg,#0f8b8d,#1d5a85);display:inline-flex;align-items:center;justify-content:center;color:#fff;margin-bottom:14px;box-shadow:0 8px 20px rgba(15,139,141,0.35)">
    <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
  </div>
  <h2 style="font-size:24px;color:var(--navy);margin:0 0 6px">Admin Sign In</h2>
  <p style="margin:0 0 20px;font-size:13.5px;color:var(--mut)">Enter your administrator credentials to access the console</p>
  <form id="admForm" onsubmit="event.preventDefault();doAdminLogin()" style="text-align:left">
    <label style="display:block;margin:14px 0 4px;font-weight:700;font-size:13px;color:var(--navy)">Admin Username
      <input id="admU" placeholder="Enter admin username" autocomplete="username" required style="width:100%;margin-top:6px;height:42px">
    </label>
    <label style="display:block;margin:14px 0 4px;font-weight:700;font-size:13px;color:var(--navy)">Password
      <input id="admP" type="password" placeholder="Enter password" autocomplete="current-password" required style="width:100%;margin-top:6px;height:42px">
    </label>
    <div id="admErr" style="color:var(--bad);font-size:13px;min-height:22px;margin:8px 0"></div>
    <button class="btn" style="width:100%;padding:12px;font-size:14.5px;border-radius:10px" id="admBtn">Sign In to Admin</button>
    <div style="text-align:center;margin-top:16px"><a href="/" style="font-size:13px;color:var(--teal-d);text-decoration:none;font-weight:600">← Back to User View</a></div>
  </form>
 </div>`;
}

async function doAdminLogin(){
 const u=$("admU").value.trim(), p=$("admP").value, err=$("admErr"), btn=$("admBtn");
 err.textContent=""; btn.disabled=true; btn.textContent="Signing in…";
 try{
  const r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u,password:p})});
  const j=await r.json();
  if(!r.ok) throw new Error(j.error||"Invalid admin credentials");
  ss.setItem("pcs_admin_token",j.token);
  TK=j.token;
  AH.headers.Authorization="Bearer "+TK;
  $("out").textContent="Log out";
  $("out").onclick=bye;
  $("main").innerHTML="";
  nav(); poll(); setInterval(poll,3000);
 }catch(e){
  err.textContent=e.message;
 }finally{
  btn.disabled=false; btn.textContent="Sign In to Admin";
 }
}

$("out").onclick=bye;
if(!TK)showAdminLogin();else{nav();poll();setInterval(poll,3000)}
